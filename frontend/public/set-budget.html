<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Budget</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
        }
        .budget-form {
            max-width: 500px;
            margin: auto;
        }
        .budget-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container budget-form">
    <h2 class="text-center">Set Budget</h2>
    <form id="budgetForm">
        <div class="form-group">
            <label for="reason">Reason:</label>
            <input type="text" class="form-control" id="reason" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" class="form-control" id="amount" required>
        </div>
        <div class="form-group">
            <label for="category">Category:</label>
            <select class="form-control" id="category" required>
                <option value="" disabled selected>Select category</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Set Budget</button>
    </form>
    <div id="message" class="mt-3"></div>

    <div class="budget-list">
        <h3>Budgets Set:</h3>
        <ul id="budgetList" class="list-group"></ul>
    </div>
</div>

<script src="../src/set-budget.ts"></script> <!-- Link to the external JavaScript file -->
</body>
</html>

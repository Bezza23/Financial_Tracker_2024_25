<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Finance Tracker</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa; /* Keep the background consistent */
        }
        .header {
            background-color: #007bff; /* Your existing header color */
            color: white;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Finance Tracker</h1>
    </div>
    <div class="container mt-4">
        <h2>Sign Up</h2>
        <form id="signup-form">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm-password" required>
            </div>
            <div class="form-group">
                <label for="role">Select Role</label>
                <select class="form-control" id="role" required>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                    <!-- Add more roles as needed -->
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <p>OR</p>
            <button type="button" class="btn btn-secondary">Continue with Google</button>
            <button type="button" class="btn btn-secondary">Continue with GitHub</button>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
    <script type="module" src="../src/signup.ts" defer></script>
</body>
</html>
